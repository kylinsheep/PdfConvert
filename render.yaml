services:
  - type: web
    name: pdf-convert-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx384m -XX:+UseSerialGC"
      - key: PORT
        value: "10000"
      - key: RENDER_DPI
        value: "120"
      - key: RENDER_MAX_PAGES
        value: "30"
